connections {
    ikev2-eap {
        remote_addrs = %any
        local {
            auth = pubkey
            certs = serverCert.pem
            id = 192.168.10.7
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
        }
        children {
            ikev2-eap {
                local_ts = 0.0.0.0/0
                remote_ts = dynamic
                esp_proposals = aes256-sha256-modp2048
                mode = tunnel
                dpd_action = clear
                start_action = start
            }
        }
        version = 2
        proposals = aes256-sha256-modp2048
    }
}

secrets {
    eap-vpnuser {
        id = vpnuser
        secret = vpnpass2024
    }
}

pools {
    vpn-pool {
        addrs = 10.10.0.0/24
    }
}
