# strongswan configuration - IKEv2 server with Certificate + EAP-MSCHAPv2
config setup
    charondebug="ike 2, knl 2, cfg 2, net 2, esp 2, tls 2, lib 2"
    uniqueids=no

conn %default
    keyexchange=ikev2
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256!
    dpdaction=clear
    dpddelay=300s
    rekey=no
    mobike=yes
    forceencaps=no
    fragmentation=yes

conn ikev2-eap
    # 服务端配置
    left=192.168.10.7
    leftid=192.168.10.7
    leftcert=serverCert.pem
    leftsendcert=always
    leftsubnet=0.0.0.0/0

    # 客户端配置
    right=%any
    rightid=%any
    rightauth=eap-mschapv2
    rightsourceip=10.10.0.0/24
    rightdns=8.8.8.8,8.8.4.4
    rightauth=eap-mschapv2
    eap_identity=%any

    auto=add