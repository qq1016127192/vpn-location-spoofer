# strongSwan IKEv2 配置 - EAP-MSCHAPv2 认证
config setup
    charondebug="ike 2, knl 2, cfg 2"
    uniqueids=no

conn %default
    keyexchange=ikev2
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256!
    dpdaction=clear
    dpddelay=300s
    rekey=no
    mobike=yes
    forceencaps=yes
    fragmentation=yes

conn ikev2-eap
    left=%any
    leftid=map.iosr.cn
    leftcert=serverCert.pem
    leftsendcert=never
    leftsubnet=0.0.0.0/0
    right=%any
    rightauth=eap-mschapv2
    rightsourceip=10.10.0.0/16
    rightdns=8.8.8.8,8.8.4.4
    eap_identity=%any
    auto=add
